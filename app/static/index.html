<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Умный поиск — демо (команда №2)</title>
<style>
  :root { --bg:#f6f7f9; --card:#fff; --ink:#1d2330; --mute:#667085; --line:#e4e7ec; --acc:#2856d8; --ok:#137a4b; --warn:#b54708; --bad:#b42318; }
  * { box-sizing:border-box; }
  body { margin:0; font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; background:var(--bg); color:var(--ink); }
  header { padding:14px 24px; background:var(--card); border-bottom:1px solid var(--line); display:flex; gap:16px; align-items:baseline; flex-wrap:wrap; }
  header h1 { font-size:18px; margin:0; }
  .tag { font-size:12px; padding:2px 8px; border-radius:10px; background:#fff4e5; color:var(--warn); border:1px solid #fedf89; }
  main { display:grid; grid-template-columns:minmax(0,1fr) 380px; gap:20px; padding:20px 24px; max-width:1400px; margin:auto; }
  @media (max-width:1000px){ main { grid-template-columns:1fr; } }
  .card { background:var(--card); border:1px solid var(--line); border-radius:10px; padding:16px; }
  .searchbox { position:relative; }
  #q { width:100%; font-size:18px; padding:12px 14px; border:1.5px solid var(--line); border-radius:8px; }
  #q:focus { outline:none; border-color:var(--acc); }
  #sugg { position:absolute; left:0; right:0; top:100%; background:#fff; border:1px solid var(--line); border-radius:8px; margin-top:4px; z-index:5; display:none; box-shadow:0 6px 18px rgba(0,0,0,.08); }
  #sugg div { padding:8px 12px; cursor:pointer; display:flex; justify-content:space-between; }
  #sugg div:hover, #sugg div.active { background:#eef2ff; }
  #sugg small { color:var(--mute); }
  .controls { display:flex; gap:10px; flex-wrap:wrap; margin-top:10px; align-items:center; font-size:14px; }
  select, input[type=text].small { padding:6px 8px; border:1px solid var(--line); border-radius:6px; font-size:14px; }
  .examples { margin-top:10px; display:flex; gap:6px; flex-wrap:wrap; }
  .chip { font-size:13px; padding:3px 10px; border-radius:14px; border:1px solid var(--line); background:#fff; cursor:pointer; }
  .chip:hover { border-color:var(--acc); color:var(--acc); }
  .chip.syn { background:#eef2ff; border-color:#c7d2fe; cursor:default; }
  .chip.unm { background:#fef3f2; border-color:#fecdca; color:var(--bad); cursor:default; }
  .meta { margin:14px 0 6px; color:var(--mute); font-size:14px; display:flex; gap:14px; flex-wrap:wrap; }
  .banner { padding:10px 12px; border-radius:8px; margin:8px 0; font-size:14px; }
  .banner.fix { background:#eef2ff; } .banner.zero { background:#fef3f2; color:#7a271a; }
  .item { border-top:1px solid var(--line); padding:12px 0; display:grid; grid-template-columns:28px 1fr auto; gap:10px; }
  .rank { color:var(--mute); font-weight:600; }
  .item h3 { margin:0; font-size:16px; }
  .item .sub { color:var(--mute); font-size:13px; }
  .item .desc { margin:4px 0; font-size:14px; }
  .why { font-size:12.5px; color:#344054; margin-top:4px; }
  .why b { font-weight:600; }
  .score { text-align:right; font-variant-numeric:tabular-nums; font-size:13px; color:var(--mute); min-width:150px; }
  .score .big { font-size:18px; color:var(--ink); font-weight:600; }
  .boost-pos { color:var(--ok); } .boost-neg { color:var(--bad); }
  .btns button { font-size:12px; margin-left:4px; padding:3px 8px; border:1px solid var(--line); border-radius:6px; background:#fff; cursor:pointer; }
  aside h2 { font-size:15px; margin:0 0 8px; }
  aside .card { margin-bottom:14px; }
  .kpis { display:grid; grid-template-columns:1fr 1fr; gap:8px; }
  .kpi { background:var(--bg); border-radius:8px; padding:8px 10px; }
  .kpi .v { font-size:20px; font-weight:600; font-variant-numeric:tabular-nums; }
  .kpi .l { font-size:12px; color:var(--mute); }
  table { width:100%; border-collapse:collapse; font-size:13px; }
  td { padding:4px 2px; border-bottom:1px solid var(--line); vertical-align:top; }
  td.n { text-align:right; font-variant-numeric:tabular-nums; width:40px; }
  .muted { color:var(--mute); font-size:12.5px; }
  details summary { cursor:pointer; color:var(--acc); font-size:12.5px; }
  pre { font-size:11.5px; background:var(--bg); padding:8px; border-radius:6px; overflow:auto; max-height:260px; }
</style>
</head>
<body>
<header>
  <h1>Умный поиск по каталогу ПО</h1>
  <span class="tag" id="datatag">данные: синтетика команды</span>
  <span class="muted" id="health"></span>
</header>
<main>
  <section>
    <div class="card">
      <div class="searchbox">
        <input id="q" autocomplete="off" placeholder="Например: антивирс для пк, тикетница, локальная срм без облака…">
        <div id="sugg"></div>
      </div>
      <div class="controls">
        <label>Категория <select id="category"><option value="">любая</option></select></label>
        <label>Сегмент <select id="segment"><option value="">—</option><option>SMB</option><option>Enterprise</option></select></label>
        <label>История (ID) <input type="text" class="small" id="history" placeholder="P003,P005" size="10"></label>
        <label><input type="checkbox" id="boost" checked> бизнес-буст</label>
        <label><input type="checkbox" id="compare"> сравнить с/без буста</label>
      </div>
      <div class="examples" id="examples"></div>
    </div>
    <div id="out"></div>
  </section>
  <aside>
    <div class="card">
      <h2>Поисковая аналитика <button class="chip" onclick="loadAnalytics()">обновить</button></h2>
      <div class="kpis" id="kpis"></div>
    </div>
    <div class="card">
      <h2>Неудачные запросы (нет в каталоге)</h2>
      <table id="zeroTbl"></table>
      <h2 style="margin-top:12px">Неудовлетворённый спрос: слова</h2>
      <div id="unmet" class="examples"></div>
    </div>
    <div class="card">
      <h2>Топ запросов</h2>
      <table id="topTbl"></table>
    </div>
    <div class="card">
      <h2>Импортированное поведение</h2>
      <div id="imported" class="muted"></div>
    </div>
  </aside>
</main>
<script>
const SESSION = Math.random().toString(36).slice(2);   // анонимно, только в памяти страницы
const EXAMPLES = ["Орбита Офис Сервер","антивирс для пк","fynbdbhec","тикетница для IT поддержки","срм","локальная срм без облака","би локально on prem","защита серверов от вирусов","компьютерные мыши","система для управления рестораном"];
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const FIELD_RU = {name:"название", vendor:"вендор", category:"категория", attributes:"характеристики", description:"описание"};
const VIA_RU = {original:"как есть", typo:"после исправления опечатки", layout:"после смены раскладки", synonym:"через синоним", compound:"часть составного слова"};
let lastSearchId = null;

async function api(path, opts) {
  const r = await fetch(path, opts);
  const j = await r.json();
  if (!r.ok) throw new Error(j.detail ? (typeof j.detail === "string" ? j.detail : JSON.stringify(j.detail)) : r.statusText);
  return j;
}

function params(boost) {
  const p = new URLSearchParams({q: $("#q").value, k: 10, session: SESSION, business_boost: boost});
  if ($("#category").value) p.set("category", $("#category").value);
  if ($("#segment").value) p.set("segment", $("#segment").value);
  if ($("#history").value.trim()) p.set("history", $("#history").value.trim());
  return p;
}

async function doSearch() {
  hideSugg();
  if (!$("#q").value.trim()) return;
  try {
    const res = await api("/search?" + params($("#boost").checked));
    lastSearchId = res.search_id;
    let other = null;
    if ($("#compare").checked) other = await api("/search?" + params(!$("#boost").checked));
    render(res, other);
    loadAnalytics();
  } catch (e) { $("#out").innerHTML = `<div class="card banner zero">Ошибка: ${esc(e.message)}</div>`; }
}

function render(r, other) {
  let h = `<div class="card">`;
  h += `<div class="meta"><span>Найдено: <b>${r.total_found}</b></span><span>Время движка: <b>${r.latency_ms} мс</b>${r.cache_hit ? " (кэш)" : ""}</span><span>Бизнес-буст: ${r.business_boost_enabled ? "вкл" : "выкл"}</span><span class="muted">search_id ${esc(r.search_id)}</span></div>`;
  if (r.corrections.length) h += `<div class="banner fix">Исправлено: ${r.corrections.map(c => `<s>${esc(c.from)}</s> → <b>${esc(c.to)}</b> <span class="muted">(${c.kind === "layout" ? "раскладка" : "опечатка"})</span>`).join(", ")}. Искали: <b>${esc(r.did_you_mean)}</b></div>`;
  if (r.synonyms_applied.length) h += `<div class="examples">${r.synonyms_applied.map(s => `<span class="chip syn">${esc(s.phrase)} ≈ ${esc(s.expanded_to.slice(0,4).join(", "))}</span>`).join("")}</div>`;
  if (r.negations.length) h += `<div class="muted" style="margin-top:6px">Исключаем: ${r.negations.map(esc).join(", ")}</div>`;
  if (r.unmatched_terms.length) h += `<div class="examples" style="margin-top:6px"><span class="muted">Нет в каталоге:</span>${r.unmatched_terms.map(t => `<span class="chip unm">${esc(t)}</span>`).join("")}</div>`;
  if (r.zero_result) {
    h += `<div class="banner zero"><b>Ничего не нашли.</b> Запрос записан в отчёт о неудачных поисках (неудовлетворённый спрос). ${r.related_queries.length ? "Возможно, вас интересует: " + r.related_queries.map(q => `<span class="chip" data-q="${esc(q)}">${esc(q)}</span>`).join(" ") : ""}</div>`;
  }
  const otherRank = {};
  if (other) other.items.forEach((it, i) => otherRank[it.id] = i + 1);
  r.items.forEach((it, i) => {
    const b = it.business_boost;
    const why = it.matched.map(m => `<b>${esc(m.term)}</b> ${VIA_RU[m.via] || m.via}${m.via !== "original" ? " «" + esc(m.matched) + "»" : ""} → ${m.fields.map(f => FIELD_RU[f] || f).join(", ")}`).join("; ");
    const miss = it.business.missing.length ? ` <span class="muted">(нет: ${it.business.missing.join(", ")} → нейтрально)</span>` : "";
    h += `<div class="item"><div class="rank">${i + 1}</div><div>
      <h3>${esc(it.name)} <span class="muted">${esc(it.id)}</span>${it.exact_match ? ' <span class="chip syn">точное совпадение</span>' : ""}</h3>
      <div class="sub">${esc(it.vendor)} · ${esc(it.category)}${it.price != null ? " · " + it.price.toLocaleString("ru") + " ₽ (синт.)" : ""}</div>
      <div class="desc">${esc(it.description)}</div>
      <div class="why">Почему: ${why || "—"}</div>
      ${it.confirmed_attributes.length ? `<div class="why">Подтверждённые характеристики: ${it.confirmed_attributes.map(esc).join(", ")}</div>` : ""}
      ${it.negated.length ? `<div class="why" style="color:var(--bad)">Понижен: содержит «${it.negated.map(esc).join(", ")}»</div>` : ""}
      ${it.context_reasons.length ? `<div class="why">Контекст: ${it.context_reasons.map(esc).join(", ")}</div>` : ""}
      ${other ? `<div class="why muted">Позиция ${other.business_boost_enabled ? "с бустом" : "без буста"}: ${otherRank[it.id] || "—"}</div>` : ""}
    </div><div class="score"><div class="big">${it.score.toFixed(3)}</div>
      релевантн. ${it.relevance_norm.toFixed(2)} · покрытие ${it.coverage.toFixed(2)}<br>
      буст <span class="${b > 0 ? "boost-pos" : b < 0 ? "boost-neg" : ""}">${b >= 0 ? "+" : ""}${b.toFixed(3)}</span> ${it.passed_relevance_gate ? "" : '<span class="muted">(ниже gate — без буста)</span>'}<br>
      поп. ${it.business.popularity_norm} · маржа ${it.business.margin_norm}${miss}
      <div class="btns" style="margin-top:6px"><button data-ev="click" data-pid="${esc(it.id)}" data-pos="${i}">клик</button><button data-ev="add_to_cart" data-pid="${esc(it.id)}" data-pos="${i}">в корзину</button><button data-ev="purchase" data-pid="${esc(it.id)}" data-pos="${i}">купить</button></div>
    </div></div>`;
  });
  if (r.related_queries.length && !r.zero_result) h += `<div class="examples" style="margin-top:8px"><span class="muted">Связанные запросы:</span>${r.related_queries.map(q => `<span class="chip" data-q="${esc(q)}">${esc(q)}</span>`).join("")}</div>`;
  h += `<details style="margin-top:10px"><summary>JSON ответа движка</summary><pre>${esc(JSON.stringify(r, null, 2))}</pre></details></div>`;
  $("#out").innerHTML = h;
}

async function sendEvent(pid, type, pos) {
  await api("/event", {method: "POST", headers: {"Content-Type": "application/json"},
    body: JSON.stringify({search_id: lastSearchId, product_id: pid, event_type: type, position: pos, session: SESSION})});
  loadAnalytics();
}

function setQ(q) { $("#q").value = q; doSearch(); }
document.addEventListener("click", e => {
  const t = e.target.closest("[data-q],[data-ev]");
  if (!t) return;
  if (t.dataset.ev) sendEvent(t.dataset.pid, t.dataset.ev, +t.dataset.pos);
  else setQ(t.dataset.q);
});

async function loadAnalytics() {
  const a = await api("/analytics?top=10");
  const t = a.totals, f = a.funnel, fo = a.failed_search_outcome;
  const pct = v => v == null ? "—" : (v * 100).toFixed(1) + "%";
  const kp = [["Поисков", t.searches], ["Доля пустых", pct(t.zero_result_rate)], ["p50, мс", t.latency_p50_ms ?? "—"], ["p95, мс", t.latency_p95_ms ?? "—"],
    ["С исправлением", pct(t.with_corrections_rate)], ["Через синоним", pct(t.with_synonyms_rate)], ["CTR поиска", pct(f.ctr)], ["Поиск → заказ", pct(f.search_to_order)],
    ["Уход после пустой", fo.zero_then_abandoned], ["Переформулировали", fo.zero_then_recovered]];
  $("#kpis").innerHTML = kp.map(([l, v]) => `<div class="kpi"><div class="v">${v}</div><div class="l">${l}</div></div>`).join("");
  $("#zeroTbl").innerHTML = a.zero_result_queries.length ? a.zero_result_queries.map(z => `<tr><td>${esc(z.query)}<div class="muted">нет в каталоге: ${esc(z.unmatched_terms.join(", ") || "—")}</div></td><td class="n">${z.count}</td></tr>`).join("") : `<tr><td class="muted">пока нет</td></tr>`;
  $("#unmet").innerHTML = a.unmet_demand_terms.map(u => `<span class="chip unm">${esc(u.term)} · ${u.count}</span>`).join("") || `<span class="muted">пока нет</span>`;
  $("#topTbl").innerHTML = a.top_queries.map(q => `<tr><td><span class="chip" data-q="${esc(q.query)}">${esc(q.query)}</span>${q.zero_result ? ' <span class="muted">(пусто)</span>' : ""}</td><td class="n">${q.count}</td></tr>`).join("") || `<tr><td class="muted">пока нет</td></tr>`;
  const ib = a.imported_behavior;
  $("#imported").innerHTML = ib ? `${esc(ib.label)}<br>событий: ${ib.events}; ${Object.entries(ib.by_type).map(([k, v]) => k + ": " + v).join(", ")}<br>сегменты: ${Object.entries(ib.by_segment).map(([k, v]) => k + ": " + v).join(", ")}` : "нет";
}

// автодополнение
let sTimer = null, sIdx = -1;
function hideSugg() { $("#sugg").style.display = "none"; sIdx = -1; }
$("#q").addEventListener("input", () => {
  clearTimeout(sTimer);
  sTimer = setTimeout(async () => {
    const v = $("#q").value;
    if (v.trim().length < 2) return hideSugg();
    const s = await api("/suggest?limit=7&q=" + encodeURIComponent(v));
    if (!s.suggestions.length) return hideSugg();
    $("#sugg").innerHTML = s.suggestions.map(x => `<div data-v="${esc(x.text)}">${esc(x.text)} <small>${esc(x.type)}</small></div>`).join("");
    $("#sugg").style.display = "block";
    $("#sugg").querySelectorAll("div").forEach(d => d.onmousedown = () => setQ(d.dataset.v));
  }, 120);
});
$("#q").addEventListener("keydown", e => {
  const els = [...$("#sugg").querySelectorAll("div")];
  if (e.key === "ArrowDown" && els.length) { sIdx = Math.min(sIdx + 1, els.length - 1); els.forEach((d, i) => d.classList.toggle("active", i === sIdx)); e.preventDefault(); }
  else if (e.key === "ArrowUp" && els.length) { sIdx = Math.max(sIdx - 1, 0); els.forEach((d, i) => d.classList.toggle("active", i === sIdx)); e.preventDefault(); }
  else if (e.key === "Enter") { if (sIdx >= 0 && els[sIdx] && $("#sugg").style.display === "block") $("#q").value = els[sIdx].dataset.v; doSearch(); }
  else if (e.key === "Escape") hideSugg();
});
$("#q").addEventListener("blur", () => setTimeout(hideSugg, 150));
["#category", "#segment", "#boost", "#compare"].forEach(s => $(s).addEventListener("change", () => $("#q").value.trim() && doSearch()));

(async () => {
  $("#examples").innerHTML = '<span class="muted">Примеры:</span>' + EXAMPLES.map(q => `<span class="chip" data-q="${esc(q)}">${esc(q)}</span>`).join("");
  const h = await api("/health");
  $("#health").textContent = `товаров: ${h.products} · маржа есть у ${h.margin_available} · v${h.version}`;
  if (!h.synthetic_data) $("#datatag").textContent = "данные: " + h.catalog;
  const c = await api("/categories");
  $("#category").innerHTML += c.categories.map(x => `<option>${esc(x)}</option>`).join("");
  loadAnalytics();
})();
</script>
</body>
</html>
